:root{
  --brand:#0f3a34;
  --brand-2:#1d5f53;
  --surface:#ffffff;
  --surface-soft:#f8fbf9;
  --line:#dbe7df;
  --muted:#61746b;
  --shadow:0 14px 30px rgba(15,58,52,.12);
}
html, body, #map{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
}
body{
  font-family:"Plus Jakarta Sans",Inter,"Segoe UI",Arial,sans-serif;
  background:#edf3ef;
}
#map{
  background:#eef3f1 !important;
}
#all{
  position:relative;
  width:100%;
  height:100%;
}
#mapWindow{
  width:100% !important;
  height:100% !important;
  display:block !important;
}
#menu{
  position:absolute !important;
  top:18px;
  right:18px;
  bottom:18px;
  width:min(350px,27vw);
  min-width:295px;
  z-index:1100;
  display:flex !important;
  flex-direction:column;
  gap:12px;
  padding:16px;
  border:1px solid rgba(219,231,223,.98);
  border-radius:18px;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(14px);
  box-shadow:var(--shadow);
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-gutter:stable both-edges;
  overscroll-behavior:contain;
  transition:transform .25s ease, opacity .25s ease, visibility .25s ease;
}
#menu.menu-hidden{
  transform:translateX(calc(100% + 24px));
  opacity:0;
  visibility:hidden;
}
.menu-header{
  position:sticky;
  top:-14px;
  z-index:2;
  margin:-14px -14px 2px;
  padding:14px 14px 12px;
  background:linear-gradient(180deg,rgba(255,255,255,.98) 0%, rgba(255,255,255,.95) 100%);
  border-bottom:1px solid #eef3ef;
}
.menu-topline{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.menu-title{
  margin:0;
  color:#18352d;
  font-size:16px;
  line-height:1.1;
  font-weight:800;
}
.menu-subtitle{
  margin:5px 0 0;
  color:var(--muted);
  font-size:11px;
  line-height:1.4;
}
.menu-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}
.menu-btn{
  appearance:none;
  border:1px solid var(--line);
  background:#fff;
  color:var(--brand);
  height:34px;
  padding:0 12px;
  border-radius:10px;
  font:700 11px/1 "Plus Jakarta Sans",Inter,"Segoe UI",Arial,sans-serif;
  cursor:pointer;
}
.menu-btn.primary{
  background:linear-gradient(135deg,var(--brand),#165247);
  border-color:var(--brand);
  color:#fff;
}
.filterselect{
  margin:0 !important;
  padding:12px !important;
  border:1px solid #e3ece6;
  border-radius:14px;
  background:#fff;
  box-shadow:0 6px 14px rgba(15,58,52,.04);
}
.filterlabel{
  margin-top:8px;
  color:#5e7067;
  font:700 12px/1.45 "Plus Jakarta Sans",Inter,"Segoe UI",Arial,sans-serif !important;
  letter-spacing:.02em;
}
.filterselect select,
.filterselect input{
  width:100%;
  max-width:100%;
  min-height:44px;
  padding:9px 10px;
  border:1px solid #d8e5dc;
  border-radius:12px;
  background:#fcfefd;
  color:#20352d;
  font:13px/1.55 "Plus Jakarta Sans",Inter,"Segoe UI",Arial,sans-serif;
  outline:none;
}
.filterselect select:focus,
.filterselect input:focus{
  border-color:#91b5a5;
  box-shadow:0 0 0 4px rgba(145,181,165,.16);
}
.filter-reset-link{
  margin-top:10px;
  color:var(--brand-2);
  font-weight:700 !important;
  cursor:pointer;
}

        .filterselect select option{
            font-family:"Plus Jakarta Sans",Inter,"Segoe UI",Arial,sans-serif;
            font-size:13px;
            padding:6px;
        }
        .filterselect::-webkit-scrollbar,
        .filterselect select::-webkit-scrollbar,
        #menu::-webkit-scrollbar{
            width:10px;
        }
        .filterselect::-webkit-scrollbar-track,
        .filterselect select::-webkit-scrollbar-track,
        #menu::-webkit-scrollbar-track{
            background:#eff5f1;
            border-radius:999px;
        }
        .filterselect::-webkit-scrollbar-thumb,
        .filterselect select::-webkit-scrollbar-thumb,
        #menu::-webkit-scrollbar-thumb{
            background:#c6d8cd;
            border-radius:999px;
            border:2px solid #eff5f1;
        }
        .leaflet-control-layers{
            margin-top:12px !important;
            max-height:calc(100vh - 180px);
            overflow:auto;
        }

.menu-toggle{
  position:absolute;
  top:18px;
  right:18px;
  z-index:1110;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 14px;
  height:42px;
  border-radius:999px;
  border:1px solid rgba(219,231,223,.98);
  background:rgba(255,255,255,.95);
  box-shadow:var(--shadow);
  color:var(--brand);
  font:800 12px/1 "Plus Jakarta Sans",Inter,"Segoe UI",Arial,sans-serif;
  cursor:pointer;
}
.menu-toggle i{font-size:13px}

.leaflet-control-search{
  display:none !important;
}

.menu-close{
  width:34px;
  height:34px;
  padding:0;
  border-radius:10px;
}
.leaflet-top.leaflet-left{
  top:72px;
}
.leaflet-top.leaflet-right{
  top:18px;
  right:18px;
}
.leaflet-control-zoom,
.leaflet-control-locate,
.leaflet-control-measure,
.leaflet-control-search,
.leaflet-control-layers{
  box-shadow:var(--shadow) !important;
}
.leaflet-control-zoom,
.leaflet-control-locate a,
.leaflet-control-measure,
.leaflet-control-search,
.leaflet-control-layers{
  border:1px solid rgba(219,231,223,.98) !important;
  border-radius:14px !important;
  overflow:hidden;
  background:rgba(255,255,255,.96) !important;
}
.leaflet-control-zoom a,
.leaflet-control-locate a,
.leaflet-control-measure .leaflet-control-measure-toggle{
  color:var(--brand) !important;
  background:#fff !important;
}
.leaflet-control-search .search-input{
  height:38px !important;
  padding:0 10px !important;
  border:none !important;
  width:180px !important;
  font:13px/1 "Plus Jakarta Sans",Inter,"Segoe UI",Arial,sans-serif !important;
}
.leaflet-control-search .search-button{
  background:#fff !important;
  color:var(--brand) !important;
  width:38px !important;
  height:38px !important;
}
.leaflet-control-layers{
  max-width:min(340px,78vw);
}
.leaflet-control-layers-expanded{padding:10px 12px !important}
.leaflet-control-layers-scrollbar{max-height:45vh !important}
.leaflet-popup-content-wrapper{
  border-radius:18px !important;
  border:1px solid rgba(219,231,223,.98);
  box-shadow:0 18px 38px rgba(15,58,52,.18) !important;
  padding:0 !important;
}
.leaflet-popup-content{
  margin:0 !important;
  min-width:240px;
  max-width:340px;
  font-family:"Plus Jakarta Sans",Inter,"Segoe UI",Arial,sans-serif;
}
.leaflet-popup-content table{
  width:100%;
  border-collapse:collapse;
}
.leaflet-popup-content tr:not(:last-child){
  border-bottom:1px solid #edf2ef;
}
.leaflet-popup-content th,
.leaflet-popup-content td{
  padding:10px 14px;
  font-size:12px;
  vertical-align:top;
}
.leaflet-popup-content th{
  width:38%;
  color:#5d6f66;
  font-weight:700;
  text-align:left;
  letter-spacing:.01em;
  background:#fbfdfb;
}
.leaflet-popup-content td{
  color:#18332b;
  font-weight:500;
}
.leaflet-popup-tip{
  background:#fff !important;
  border:1px solid rgba(219,231,223,.98);
  box-shadow:0 10px 20px rgba(15,58,52,.12);
}
.leaflet-control-attribution{
  background:rgba(255,255,255,.92) !important;
  color:#5f7369 !important;
  font-size:10px !important;
  border-radius:10px 0 0 0;
}
.leaflet-control-scale-line{
  background:rgba(255,255,255,.94) !important;
  border-color:var(--brand) !important;
  color:var(--brand) !important;
  font-size:10px !important;
}
.north-arrow-control,
.basemap-switcher{
  background:rgba(255,255,255,.96);
  border:1px solid rgba(219,231,223,.98);
  box-shadow:var(--shadow);
}
.north-arrow-control{
  min-width:38px;
  padding:6px 8px;
  border-radius:12px;
  color:var(--brand);
  text-align:center;
  font:800 10px/1 "Plus Jakarta Sans",Inter,"Segoe UI",Arial,sans-serif;
}
.north-arrow-control .arrow{
  display:block;
  margin-top:3px;
  font-size:19px;
  line-height:1;
}
.basemap-switcher{
  display:flex;
  gap:6px;
  padding:6px;
  border-radius:14px;
}
.basemap-switcher button{
  height:34px;
  padding:0 12px;
  border:none;
  border-radius:10px;
  background:#fff;
  color:#28463f;
  font:700 11px/1 "Plus Jakarta Sans",Inter,"Segoe UI",Arial,sans-serif;
  cursor:pointer;
}
.basemap-switcher button.active{
  background:linear-gradient(135deg,var(--brand),#165247);
  color:#fff;
}
.map-watermark{
  position:absolute;
  right:18px;
  bottom:18px;
  z-index:700;
  padding:10px 12px;
  border:1px solid rgba(219,231,223,.98);
  border-radius:14px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);
  box-shadow:var(--shadow);
  color:#19362f;
  font:700 11px/1.35 "Plus Jakarta Sans",Inter,"Segoe UI",Arial,sans-serif;
}
.map-watermark small{
  display:block;
  margin-top:2px;
  color:#5f7369;
  font-weight:600;
  font-size:10px;
}
.map-watermark.hidden-by-panel{
  right:390px;
}
@media (max-width:960px){
  #menu{
    width:min(340px,84vw);
    min-width:unset;
  }
  .map-watermark.hidden-by-panel{right:18px}
}
@media (max-width:760px){
  .leaflet-top.leaflet-left{top:66px}

    width:min(330px,88vw);

    border-radius:16px;
  }
  .menu-header{top:-12px;margin:-12px -12px 2px;padding:12px 12px 10px}

  .map-watermark{left:12px; right:auto; bottom:46px}
  .leaflet-control-layers{max-width:min(300px,78vw)}
}

        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 0, 1.00)',
                fillOpacity: 1
              });
            }
            highlightLayer.openPopup();
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:19, minZoom:14
        }).fitBounds([[-7.7681049047060435,110.2965156878364],[-7.749196970029815,110.32842120991687]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        L.control.scale({position: 'bottomleft', metric: true, imperial: false, maxWidth: 130}).addTo(map);
        var northArrow = L.control({position: 'bottomleft'});
        northArrow.onAdd = function() {
            var div = L.DomUtil.create('div', 'north-arrow-control');
            div.innerHTML = '<span>N</span><span class="arrow">↑</span>';
            L.DomEvent.disableClickPropagation(div);
            return div;
        };
        northArrow.addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        function pop_TutupanLahan_0(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">LUAS_M2</th>\
                        <td>' + (feature.properties['LUAS_M2'] !== null ? autolinker.link(String(feature.properties['LUAS_M2']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">SUMBER</th>\
                        <td>' + (feature.properties['SUMBER'] !== null ? autolinker.link(String(feature.properties['SUMBER']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2"><strong>OBJEK</strong><br />' + (feature.properties['OBJEK'] !== null ? autolinker.link(String(feature.properties['OBJEK']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">KELURAHAN</th>\
                        <td>' + (feature.properties['KELURAHAN'] !== null ? autolinker.link(String(feature.properties['KELURAHAN']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        var pattern_TutupanLahan_0_0 = new L.StripePattern({

                    break;

                    return {

                color: 'rgba(35,35,35,1.0)',

                lineCap: 'butt',

                fill: true,
                fillOpacity: 1,

                    break;

                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(249,189,139,1.0)',
                interactive: true,

                    break;
                case 'Sawah irigasi':

                fillOpacity: 1,
                fillPattern: pattern_TutupanLahan_0_0,
                interactive: true,

                    break;

        }
        map.createPane('pane_TutupanLahan_0');
        map.getPane('pane_TutupanLahan_0').style.zIndex = 400;
        map.getPane('pane_TutupanLahan_0').style['mix-blend-mode'] = 'normal';
        var layer_TutupanLahan_0 = new L.geoJson(json_TutupanLahan_0, {

            layerName: 'layer_TutupanLahan_0',
            pane: 'pane_TutupanLahan_0',
            onEachFeature: pop_TutupanLahan_0,

            if (nibSearchHighlight && map.hasLayer(nibSearchHighlight)) {

            try { layer_BidangTanah_5.closePopup(); } catch (e) {}
        }

        function searchBidangByNIB(searchValue) {
            clearNibSearchResult();
            var raw = String(searchValue || '').trim();
            var q = raw.toLowerCase();
            var foundLayer = null;
            layer_BidangTanah_5.eachLayer(function(lyr) {
                if (foundLayer) return;
                var props = (lyr.feature && lyr.feature.properties) ? lyr.feature.properties : {};
                var nib = String(props.NIB == null ? '' : props.NIB).trim().toLowerCase();
                if (nib === q || (q && nib.indexOf(q) !== -1)) {
                    foundLayer = lyr;
                }
            });
            if (foundLayer) {
                if (!map.hasLayer(layer_BidangTanah_5)) {
                    map.addLayer(layer_BidangTanah_5);
                }
                nibSearchHighlight = L.geoJSON(foundLayer.toGeoJSON(), {
                    style: function() {
                        return {color:'#d62828', weight:4, opacity:1, fillColor:'#ffbe0b', fillOpacity:0.18};
                    },
                    pane: 'pane_BidangTanah_5'
                }).addTo(map);
                var bounds = foundLayer.getBounds ? foundLayer.getBounds() : nibSearchHighlight.getBounds();
                if (bounds && bounds.isValid()) {
                    map.fitBounds(bounds.pad(0.6), {maxZoom: 20});
                }
                if (typeof foundLayer.openPopup === 'function') {
                    foundLayer.openPopup();
                }
                postToParent({type:'nibSearchResult', found:true, value: raw});
                return true;
            }
            postToParent({type:'nibSearchResult', found:false, value: raw});
            return false;
        }

        window.addEventListener('message', function(event) {
            var data = event.data || {};
            if (!data.type) return;
            if (data.type === 'toggleFilterPanel') {
                syncPanelState(col2.classList.contains('menu-hidden'));
            } else if (data.type === 'openFilterPanel') {
                syncPanelState(true);
            } else if (data.type === 'closeFilterPanel') {
                syncPanelState(false);
            } else if (data.type === 'toggleLayerPanel') {
                toggleLayerPanel();
            } else if (data.type === 'setBasemap') {
                activateBase(data.base === 'sat' ? 'sat' : 'osm');
                postToParent({type:'basemapChanged', base:data.base === 'sat' ? 'sat' : 'osm'});
            } else if (data.type === 'searchNIB') {
                searchBidangByNIB(data.value);
            } else if (data.type === 'clearNibSearch') {
                clearNibSearchResult();
            }
        });

                  for (var i=0; i < options.length; i++) {

                  }
                    try{
                      if (key in features[0].properties){
                        for (i = features.length - 1;
                          i >= 0; --i){
                          if (selection.indexOf(
                          features[i].properties[key])<0
                          && selection.length>0) {
                          features.splice(i,1);
                          }
                        }

                  }
